[package]
name = "spacetimedb-sdk"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "A Rust SDK for clients to interface with SpacetimeDB"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["native-tls"]
# The TLS backend of a native connection's WebSocket (`wss://`). A browser
# connection uses the browser's own and reads none of these.
#
# `native-tls`: the platform's TLS library: SChannel on Windows,
# Security.framework on macOS, OpenSSL everywhere else, Android included.
native-tls = ["dep:native-tls", "tokio-tungstenite/native-tls"]
# `rustls-tls`: rustls, verifying the server against the roots of the client
# configuration `DbConnectionBuilder::with_rustls_config` supplies. A `wss://`
# connection with no configuration and neither root feature below is refused
# before it dials.
rustls-tls = ["dep:rustls", "tokio-tungstenite/__rustls-tls"]
# rustls with the platform's trust store (`rustls-native-certs`) as the roots
# of a connection that supplies no configuration of its own. The configuration
# a root feature builds takes rustls's process-default crypto provider: the
# application enables one rustls provider feature (`ring`, `aws-lc-rs`) or
# installs one.
rustls-tls-native-roots = ["rustls-tls", "tokio-tungstenite/rustls-tls-native-roots"]
# rustls with Mozilla's root set compiled in (`webpki-roots`) as the roots of
# a connection that supplies no configuration of its own.
rustls-tls-webpki-roots = ["rustls-tls", "tokio-tungstenite/rustls-tls-webpki-roots"]
allow_loopback_http_for_tests = ["spacetimedb-testing/allow_loopback_http_for_tests"]
browser = [
    "dep:getrandom",
    "dep:gloo-console",
    "dep:gloo-net",
    "dep:gloo-storage",
    "dep:gloo-utils",
    "dep:js-sys",
    "dep:tokio-tungstenite-wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
spacetimedb-data-structures.workspace = true
spacetimedb-sats.workspace = true
spacetimedb-lib = { workspace = true, features = ["serde", "metrics_impls"]}
spacetimedb-client-api-messages.workspace = true
spacetimedb-metrics.workspace = true
spacetimedb-query-builder.workspace = true
spacetimedb-schema.workspace = true

thiserror.workspace = true
anymap3 = "1.0.1"
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
futures.workspace = true
futures-channel.workspace = true
http.workspace = true
log.workspace = true
once_cell.workspace = true
prometheus.workspace = true
rand.workspace = true

getrandom = { version = "0.3.4", features = ["wasm_js"], optional = true }
gloo-console = { version = "0.3.0", optional = true }
gloo-net = { version = "0.6.0", optional = true }
gloo-storage = { version = "0.3.0", optional = true }
gloo-utils = { version = "0.2.0", optional = true }
js-sys = { version = "0.3", optional = true }
tokio-tungstenite-wasm = { version = "0.6.0", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.45", optional = true }
web-sys = { version = "0.3.77", features = ["HtmlDocument"], optional = true }
# The Zero engine's clock (`zero_time::current_epoch_ns`), which stamps a
# reducer call the connection ended before sending (src/db_connection.rs) on
# native and wasm alike. The engine supplies it through its own
# `[patch.crates-io]`, and this workspace's root manifest supplies it from the
# engine's repository.
zero_time = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
home.workspace = true
tokio.workspace = true
# The workspace's version, without the workspace's `native-tls` feature: the
# TLS backend is this crate's `native-tls` / `rustls-tls*` features.
tokio-tungstenite = { version = "0.27.0", features = ["url"] }
# native-tls 0.2.17 fails to compile with Rust 1.93.0 due non-exhaustive
# matching in upstream code. Pin until upstream ships a compatible release.
native-tls = { version = "=0.2.14", optional = true }
# The client configuration type `DbConnectionBuilder::with_rustls_config`
# takes: the rustls tokio-tungstenite connects with.
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# for quickstart-chat and cursive-chat examples
hex.workspace = true
# for cursive-chat example
cursive.workspace = true
futures-channel.workspace = true
shlex = "1.3.0"

# for tests
spacetimedb-testing = { path = "../../crates/testing" }

[lints]
workspace = true
